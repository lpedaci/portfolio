<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | Lourdes Pedaci</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D0E12">
  <script>
    // Un 404 puede servirse en cualquier ruta: las hojas de fuentes e íconos se piden desde la raíz del sitio.
    (() => {
      const seg = location.pathname.split('/').filter(Boolean)[0];
      const root = /github\.io$/.test(location.hostname) && seg ? `/${seg}/` : '/';
      ['assets/css/fonts.css?v=202610051313', 'assets/css/icons.css?v=202610051313'].forEach((href) => {
        const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = root + href; document.head.appendChild(l);
      });
      [['icon', 'assets/img/favicon.svg', 'image/svg+xml'], ['apple-touch-icon', 'assets/img/apple-touch-icon.png', '']].forEach(([rel, href, type]) => {
        const l = document.createElement('link'); l.rel = rel; l.href = root + href; if (type) l.type = type; document.head.appendChild(l);
      });
    })();
  </script>
  <!-- Página autocontenida: un 404 puede servirse en cualquier ruta, así que no depende de rutas relativas -->
  <style>
    :root {
      --bg: #0D0E12; --surface: #15171C; --surface-2: #1B1D23; --text: #F2F2EF; --muted: #9A9AA3; --line: #24262E;
      --it: #35C2B1; --cap: #EC7FB0; --on-accent: #0D0E12;
      --f-display: 'Schibsted Grotesk', system-ui, sans-serif; --f-body: 'Hanken Grotesk', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1); --gutter: 16px; color-scheme: dark;
    }
    @media (min-width: 768px) { :root { --gutter: 32px; } }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 400 1rem/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
    a { color: inherit; } button { font: inherit; color: inherit; } p, h1 { margin: 0; }
    :focus-visible { outline: 2px solid var(--it); outline-offset: 3px; border-radius: 4px; }
    .wrap { width: 100%; max-width: 1280px; margin-inline: auto; padding-inline: var(--gutter); }

    .skip { position: absolute; left: var(--gutter); top: -100px; z-index: 30; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 500; text-decoration: none; }
    .skip:focus { top: 12px; }
    .nav { border-bottom: 1px solid var(--line); }
    .nav__inner { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .nav__brand { display: inline-flex; align-items: center; min-height: 44px; font: 600 1.0625rem/1 var(--f-display); letter-spacing: -0.01em; text-decoration: none; }
    .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
    .lang button { font: 500 0.75rem/1 var(--f-mono); letter-spacing: 0.04em; background: none; border: 0; border-radius: 999px; min-width: 40px; min-height: 32px; padding: 0 10px; cursor: pointer; color: var(--muted); }
    .lang button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

    main { flex: 1; display: grid; place-items: center; padding-block: 40px 64px; }
    .nf { display: grid; justify-items: center; text-align: center; gap: 0; }
    .scene { position: relative; width: min(100%, 600px); }
    .scene svg { display: block; width: 100%; height: auto; overflow: visible; }
    .eyebrow { margin-top: 24px; font: 400 0.8125rem/1 var(--f-mono); color: var(--it); }
    h1 { margin-top: 14px; font: 600 clamp(2rem, 1.4rem + 2.6vw, 3rem)/1.08 var(--f-display); letter-spacing: -0.025em; text-wrap: balance; }
    .lead { margin-top: 14px; color: var(--muted); font-size: 1.0625rem; max-width: 44rem; text-wrap: balance; }
    .lead span { display: block; }  /* una oración por línea */
    .ctas { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 500; text-decoration: none; white-space: nowrap; border: 1px solid transparent; transition: transform 0.2s var(--ease), background-color 0.2s var(--ease), border-color 0.2s var(--ease); }
    .btn:active { transform: translateY(1px); }
    .btn--primary { background: var(--it); color: var(--on-accent); }
    .btn--primary:hover { background: #4fd0c0; }
    .btn--ghost { border-color: var(--line); }
    .btn--ghost:hover { border-color: var(--muted); }
    .foot { border-top: 1px solid var(--line); }
    .foot p { padding-block: 24px; font: 400 0.8125rem/1 var(--f-mono); color: var(--muted); }
    .foot__inner { display: flex; align-items: center; gap: 12px; }
    .foot__in { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--muted); transition: color 0.2s var(--ease); }
    .foot__in:hover { color: var(--text); }
    .foot__in:focus-visible { outline: 2px solid var(--it); outline-offset: 3px; }
    .foot__icon { width: 18px; height: 18px; fill: currentColor; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* ---------- Gatito ----------
       En el suelo, agazapado en pose de juego, juega con el hilo del ovillo (el cero del 404).
       Una pasada de 5 s: mueve la cola, parpadea, menea la cola antes de atacar,
       le da un manotazo al hilo (el tirón acerca el ovillo) y al final se pregunta dónde está la página. */
    .digit { font: 600 210px/1 var(--f-display); fill: var(--surface-2); stroke: #2C3038; stroke-width: 1.5; }
    .cat { fill: #5A5F6B; }        /* gatito tuxedo: cuerpo gris oscuro */
    .cat-white { fill: #ECECE8; }  /* medias, hocico y panza blancos */
    .cat-far { fill: #4A4E58; }    /* pata del lado lejano: un tono más oscuro, se lee detrás */
    .cat-far-white { fill: #D2D2CE; }
    .ear-in { fill: var(--cap); }
    .eye { fill: var(--it); }
    .pupil { fill: var(--bg); }
    .nose { fill: var(--cap); }
    .whisker { stroke: #C9C9CF; stroke-width: 1.2; stroke-linecap: round; fill: none; }
    .ball { fill: var(--it); }
    .wrapline { fill: none; stroke: #0F5E55; stroke-width: 3; stroke-linecap: round; }
    .thread { fill: none; stroke: var(--it); stroke-width: 2.5; stroke-linecap: round; }
    .shadow { fill: #000; opacity: 0.35; }
    .q { font: 500 22px/1 var(--f-mono); fill: var(--it); opacity: 0; }

    .ball-g, .ball-spin, .q { transform-box: view-box; }
    .ball-spin { transform-origin: 262px 214px; }
    /* Piezas del gatito: el eje se mide sobre cada pieza (fill-box), así el gatito se puede escalar entero */
    .tail, .rear, .head, .ear-r, .eyes, .paw { transform-box: fill-box; }
    .tail { transform-origin: 10% 95%; }    /* base de la cola */
    .rear { transform-origin: 70% 100%; }   /* patas traseras en el piso */
    .head { transform-origin: 60% 100%; }   /* cuello */
    .ear-r { transform-origin: 20% 100%; }
    .eyes { transform-origin: 50% 50%; }
    .paw { transform-origin: 50% 8%; }      /* hombro */

    /* Juega una vez (5 s) al cargar y queda agazapado; vuelve a jugar al pasar el mouse o tocar la escena.
       Así ninguna animación dura más de 5 s sin control (WCAG 2.2.2) y no hace falta un botón de pausa. */
    @media (prefers-reduced-motion: no-preference) {
      .scene { cursor: pointer; }
      .is-playing .tail { animation: tail 5s ease-in-out; }
      .is-playing .eyes { animation: blink 5s; }
      .is-playing .ear-r { animation: ear 5s; }
      .is-playing .rear { animation: wiggle 5s; }
      .is-playing .head { animation: head 5s ease-in-out; }
      .is-playing .paw { animation: paw 5s ease-in-out; }
      .is-playing .ball-g { animation: roll 5s ease-in-out; }
      .is-playing .ball-spin { animation: spin 5s ease-in-out; }
      .is-playing .q { animation: q 5s ease-in-out; }
    }
    /* Un solo manotazo, con tiempo: mira el hilo, menea la cola, levanta la pata despacio y la baja.
       Todo entra en los 5 s de la pasada. */
    @keyframes tail { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 55% { transform: rotate(14deg); } 80% { transform: rotate(-4deg); } }
    @keyframes blink { 0%, 4%, 100% { transform: scaleY(1); } 7% { transform: scaleY(0.1); } 10% { transform: scaleY(1); } }
    @keyframes ear { 0%, 80%, 90%, 100% { transform: rotate(0); } 84% { transform: rotate(-14deg); } 87% { transform: rotate(4deg); } }
    /* Meneo de la cola antes de atacar, como hacen los gatos */
    @keyframes wiggle {
      0%, 16%, 38%, 100% { transform: translateX(0); }
      20%, 28% { transform: translateX(-2px); } 24%, 32% { transform: translateX(2px); }
    }
    /* Sigue el hilo con la cabeza: baja la mirada mientras ataca */
    @keyframes head { 0%, 10% { transform: rotate(0); } 22%, 70% { transform: rotate(-7deg); } 80%, 100% { transform: rotate(3deg); } }
    /* Manotazo: levanta la pata hacia adelante sin apuro y la baja sobre el hilo */
    @keyframes paw {
      0%, 36% { transform: rotate(0); } 48% { transform: rotate(72deg); } 55% { transform: rotate(-4deg); } 60%, 100% { transform: rotate(0); }
    }
    /* El tirón del hilo acerca el ovillo, que rueda y vuelve a su lugar */
    @keyframes roll { 0%, 55% { transform: translateX(0); } 68% { transform: translateX(12px); } 86%, 100% { transform: translateX(0); } }
    @keyframes spin { 0%, 55% { transform: rotate(0); } 68% { transform: rotate(40deg); } 86%, 100% { transform: rotate(0); } }
    @keyframes q { 0%, 84% { opacity: 0; transform: translateY(6px); } 90%, 97% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-4px); } }
  </style>
</head>
<body>

                <ellipse class="eye" cx="490" cy="245" rx="4.5" ry="6"/>
                <ellipse class="eye" cx="507" cy="245" rx="4.5" ry="6"/>
                <ellipse class="pupil" cx="489" cy="247" rx="1.8" ry="3.4"/>
                <ellipse class="pupil" cx="506" cy="247" rx="1.8" ry="3.4"/>
              </g>
              <ellipse class="cat-white" cx="498" cy="260" rx="11" ry="8"/>
              <path class="nose" d="M495 255 L501 255 L498 259 Z"/>
              <path class="whisker" d="M487 259 L467 255 M487 263 L467 265 M509 259 L527 255 M509 263 L527 265"/>
            </g>
            <!-- pata que da el manotazo (gira desde el hombro), por delante de la cabeza -->
            <g class="paw">
              <rect class="cat" x="505" y="262" width="14" height="28" rx="7"/>

          </g>
        </svg>
      </div>

      <p class="eyebrow" data-i18n="eyebrow">error 404</p>
      <h1 data-i18n="title">Esta página no existe</h1>
      <p class="lead"><span data-i18n="lead1">Puede que el enlace esté desactualizado o que el proyecto haya cambiado de lugar.</span> <span data-i18n="lead2">Todo lo demás sigue a un clic.</span></p>
      <div class="ctas">
        <a class="btn btn--primary js-home" href="/"><i class="ph ph-arrow-left" aria-hidden="true"></i><span data-i18n="home">Volver al inicio</span></a>
        <a class="btn btn--ghost js-work" href="/#proyectos"><span data-i18n="work">Ver proyectos</span></a>

  </main>

  <footer class="foot">
    <div class="wrap foot__inner">
      <p>© 2026 Lourdes Pedaci</p>
      <a class="foot__in" href="https://www.linkedin.com/in/lourdes-pedaci/" target="_blank" rel="noopener"><svg class="foot__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg><span class="sr-only">LinkedIn <span data-i18n="newTab">(se abre en una pestaña nueva)</span></span></a>
    </div>
  </footer>

  <script>
    (() => {
      const T = {
        es: {
          docTitle: 'Página no encontrada | Lourdes Pedaci', langLabel: 'Idioma', skip: 'Ir al contenido',
          catLabel: 'Un gatito gris con medias blancas, agazapado en el suelo, juega con el hilo de un ovillo de lana que ocupa el lugar del cero.',
          eyebrow: 'error 404', title: 'Esta página no existe',
          lead1: 'Puede que el enlace esté desactualizado o que el proyecto haya cambiado de lugar.',
          lead2: 'Todo lo demás sigue a un clic.',
          home: 'Volver al inicio', work: 'Ver proyectos',
          newTab: '(se abre en una pestaña nueva)'
        },
        en: {
          docTitle: 'Page not found | Lourdes Pedaci', langLabel: 'Language', skip: 'Skip to content',
          catLabel: 'A grey kitten with white socks, crouched on the floor, plays with the thread of a ball of yarn that takes the place of the zero.',
          eyebrow: 'error 404', title: 'This page does not exist',
          lead1: 'The link may be outdated, or the project may have moved.',
          lead2: 'Everything else is one click away.',
          home: 'Back to home', work: 'See projects',
          newTab: '(opens in a new tab)'
        }
      };

      // Raíz del sitio: en GitHub Pages de proyecto es /<repo>/; en local o dominio propio, /.
      const seg = location.pathname.split('/').filter(Boolean)[0];
      const root = /github\.io$/.test(location.hostname) && seg ? `/${seg}/` : '/';

      const store = {
        get(k) { try { return localStorage.getItem(k); } catch { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } }
      };
      const fromUrl = new URLSearchParams(location.search).get('lang');
      const saved = store.get('lang');
      const browser = (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
      let lang = ['es', 'en'].includes(fromUrl) ? fromUrl : (['es', 'en'].includes(saved) ? saved : browser);

      const scene = document.getElementById('scene');

      function apply() {
        const t = T[lang];
        document.documentElement.lang = lang;
        document.title = t.docTitle;
        document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
        document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t[el.dataset.i18nAria]); });
        document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
        document.querySelectorAll('.js-home').forEach((a) => { a.href = `${root}?lang=${lang}`; });
        document.querySelectorAll('.js-work').forEach((a) => { a.href = `${root}?lang=${lang}#proyectos`; });
      }

      document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        store.set('lang', lang);
        apply();
      }));
      // Una pasada al cargar; al pasar el mouse o tocar la escena, otra (si no está jugando ya).
      const play = () => {
        if (scene.classList.contains('is-playing')) return;
        scene.classList.add('is-playing');
        setTimeout(() => scene.classList.remove('is-playing'), 5100);
      };
      scene.addEventListener('pointerenter', play);
      scene.addEventListener('click', play);
      play();
      apply();
    })();
  </script>
